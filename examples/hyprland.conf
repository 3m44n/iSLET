# Hyprland snippet for Islet (`~/.config/hypr/hyprland.conf`)

exec-once = islet

# Optional compositor-side frosted glass blur behind the pill
layerrule = blur, islet
layerrule = ignorealpha 0.2, islet

# Optional manual IPC bindings (Islet already auto-detects PipeWire & backlight changes!)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind   = SUPER, I,               exec, islet-ctl toggle
